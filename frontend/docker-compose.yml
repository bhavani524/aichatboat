version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    ports: ['27017:27017']

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai_chatbot
    depends_on: [mongo]
    ports: ['3001:3001']

volumes:
  mongo_data: